name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, for example v0.1.0"
        required: true
      dry_run:
        description: "Build and package only — no Release, no tap push"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAP_REPO: tom19830924/homebrew-tap
  FORMULA: Formula/am.rb

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - name: Write the tag into Version.swift
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i '' "s/static let version = \"dev\"/static let version = \"$VERSION\"/" \
            Sources/am/Version.swift
          # A silent no-op here would ship a binary calling itself "dev".
          grep -q "static let version = \"$VERSION\"" Sources/am/Version.swift \
            || { echo "::error::the version was never written into Version.swift"; exit 1; }
          echo "wrote $VERSION"

      - name: Test
        run: swift test

      - name: Build the universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package
        id: pkg
        run: |
          BINDIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          NAME="am-${{ steps.ver.outputs.version }}-macos-universal.tar.gz"
          mkdir -p dist
          tar czf "dist/$NAME" -C "$BINDIR" am
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "dist/$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          lipo -info "$BINDIR/am"
          # The binary itself is the last word: what it reports is what the
          # user will see, whatever happened earlier in the workflow.
          REPORTED="$("$BINDIR/am" --version)"
          [ "$REPORTED" = "${{ steps.ver.outputs.version }}" ] \
            || { echo "::error::the binary reports $REPORTED, but the tag is ${{ steps.ver.outputs.version }}"; exit 1; }
          echo "the binary reports $REPORTED"

      - name: Show what was built
        run: |
          echo "file  : ${{ steps.pkg.outputs.name }}"
          echo "sha256: ${{ steps.pkg.outputs.sha }}"
          ls -lh dist/

      # ---- a dry run stops here, leaving the build downloadable as an artifact ----
      - name: Upload the artifact (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "dist/${{ steps.pkg.outputs.name }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

      - name: Check out the tap
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_WRITER }}
          path: tap

      - name: Regenerate the formula and push it
        if: ${{ !inputs.dry_run }}
        working-directory: tap
        run: |
          mkdir -p Formula
          cat > "${{ env.FORMULA }}" <<EOF
          # Generated by CI in ${{ github.repository }}. Do not edit by hand.
          class Am < Formula
            desc "Per-project AI agent gateway switcher"
            homepage "https://github.com/${{ github.repository }}"
            url "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/${{ steps.pkg.outputs.name }}"
            sha256 "${{ steps.pkg.outputs.sha }}"
            version "${{ steps.ver.outputs.version }}"

            depends_on macos: :ventura

            def install
              bin.install "am"
            end

            test do
              assert_match "am", shell_output("#{bin}/am --help")
            end
          end
          EOF
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.FORMULA }}"
          if git diff --cached --quiet; then
            echo "formula unchanged, nothing to push"
          else
            git commit -m "am ${{ steps.ver.outputs.version }}"
            git push
          fi
